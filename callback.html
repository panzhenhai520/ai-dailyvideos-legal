<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authorization Callback — AI DailyVideos</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:640px;margin:0 auto;padding:40px 20px;color:#1a1a1a;line-height:1.7;text-align:center}
.ok{font-size:22px;font-weight:700;color:#0a7d2c;margin-bottom:8px}
.err{font-size:22px;font-weight:700;color:#c00;margin-bottom:8px}
.codebox{background:#f4f4f5;border:1px solid #ddd;border-radius:8px;padding:16px;margin:20px 0;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:14px;text-align:left;user-select:all}
.hint{color:#666;font-size:14px}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var code = p.get("code"), err = p.get("error"), app = document.getElementById("app");
  if (code) {
    app.innerHTML = '<div class="ok">✓ Authorization successful</div>'
      + '<p>Copy the authorization code below and paste it into the publisher tool:</p>'
      + '<div class="codebox">' + code.replace(/</g,"&lt;") + '</div>'
      + '<p class="hint">This code expires in a few minutes. Run <b>python tiktok_client.py exchange &lt;CODE&gt;</b> promptly.</p>';
  } else {
    app.innerHTML = '<div class="err">Authorization failed</div>'
      + '<p>' + (err ? err.replace(/</g,"&lt;") : "No code returned.") + '</p>'
      + '<p class="hint">Please try the authorization link again.</p>';
  }
})();
</script>
</body>
</html>
